  // El runtime lo avanza cuadro por cuadro y emite hf-seek; js/motion.js dibuja cada instante.
  window.READY.then(() => {
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: window.CONFIG.duration }, 0);
    window.__timelines["main"] = tl;
  });
</script>
</body>
</html>
