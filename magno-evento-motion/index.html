<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magno Evento Empresarial — Invitación</title>
<style>
@font-face { font-family: 'Archivo'; src: url(assets/fonts/archivo-latin-standard-normal.woff2) format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: 'Montserrat'; src: url(assets/fonts/montserrat-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Cormorant'; src: url(assets/fonts/cormorant-garamond-latin-600-italic.woff2) format('woff2'); font-weight: 600; font-style: italic; }

:root {
  --ink: #f4efe6;
  --gold: #e2b54f;
  --gold-soft: #ecc879;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }

#viewport { position: fixed; inset: 0 0 56px 0; display: flex; align-items: center; justify-content: center; }
body.render #viewport { inset: 0; display: block; }
#stage { position: relative; flex: none; width: 1080px; height: 1920px; overflow: hidden; background: #000; transform-origin: center center; }
body.render #stage { transform: none !important; }
.layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
.scene { position: absolute; inset: 0; visibility: hidden; }

/* ---------- fondo ---------- */
#bg { background: radial-gradient(130% 75% at 50% 42%, #17110a 0%, #0a0805 46%, #020202 100%); }
#glow { position: absolute; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; left: 540px; top: 760px;
  background: radial-gradient(circle, rgba(222,168,60,.34) 0%, rgba(222,168,60,.13) 28%, rgba(222,168,60,.04) 48%, rgba(222,168,60,0) 66%); }
#rays { position: absolute; width: 2400px; height: 2400px; left: 540px; top: 900px; margin: -1200px 0 0 -1200px; opacity: 0;
  background: repeating-conic-gradient(from 0deg, rgba(255,214,140,.12) 0deg 1.4deg, rgba(255,214,140,0) 1.4deg 7deg);
  -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.45) 18%, rgba(0,0,0,0) 40%);
  mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.45) 18%, rgba(0,0,0,0) 40%); filter: blur(2px); }

/* ---------- utilidades de texto ---------- */
.ch { display: inline-block; white-space: pre; }
.gold { background: linear-gradient(180deg, #fff6d6 0%, #f5d47e 30%, #d9a842 56%, #f7df92 82%, #b8862b 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.silver { background: linear-gradient(180deg, #ffffff 0%, #ece8e0 46%, #b4afa5 56%, #f7f4ee 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.metal { position: absolute; left: 0; width: 1080px; overflow: visible; }
.metal text { font-family: 'Archivo'; font-weight: 900; font-stretch: 125%; text-anchor: middle; }
.sheen { position: absolute; inset: 0; mix-blend-mode: overlay; opacity: 0; }
.sheen i { position: absolute; top: -10%; height: 120%; width: 380px; left: 0;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.95) 50%, rgba(255,255,255,0) 100%); }

/* ---------- logo ---------- */
.logo { position: absolute; left: 0; right: 0; text-align: center; color: var(--ink); }
.logo-main { font-weight: 600; font-size: 1em; line-height: 1; white-space: nowrap; letter-spacing: .03em; padding-left: .03em; }
.logo .lam { width: .76em; height: .7em; }
.logo .lam svg { display: block; width: 100%; height: 100%; }
.logo .reg { display: inline-block; font-size: .2em; font-weight: 600; vertical-align: top; margin-left: .1em; color: var(--gold); }
.logo-sub { font-weight: 400; font-size: .4em; letter-spacing: .5em; padding-left: .5em; margin-top: .42em; color: #ece8df; line-height: 1; }
.logo-net { display: flex; align-items: center; justify-content: center; gap: .55em; font-size: .29em; font-weight: 600;
  letter-spacing: .5em; margin-top: .62em; color: var(--gold); line-height: 1; }
.logo-net span { padding-left: .5em; }
.logo-net .ln { display: block; width: 3.6em; height: 2px; background: linear-gradient(90deg, rgba(212,164,55,0), #d4a437); transform-origin: right center; }
.logo-net .ln.r { background: linear-gradient(270deg, rgba(212,164,55,0), #d4a437); transform-origin: left center; }

/* ---------- caja con marco dorado ---------- */
.box { position: absolute; left: 50%; }
.box .fill { position: absolute; inset: 0; border-radius: 10px; background: linear-gradient(180deg, rgba(24,18,9,.9), rgba(6,5,3,.9)); opacity: 0; }
.box .frame { position: absolute; left: 0; top: 0; overflow: visible; }
.box .frame path { fill: none; stroke: url(#gFrame); stroke-width: 2.6; stroke-dasharray: 1; stroke-dashoffset: 1; }
.box .bt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; white-space: nowrap; }
.box .wing { position: absolute; top: 50%; height: 2px; margin-top: -1px; }
.box .wing.l { right: 100%; margin-right: 18px; background: linear-gradient(90deg, rgba(212,164,55,0), #d4a437); transform-origin: right center; }
.box .wing.r { left: 100%; margin-left: 18px; background: linear-gradient(270deg, rgba(212,164,55,0), #d4a437); transform-origin: left center; }

/* ---------- escena 2: título ---------- */
#hosts { position: absolute; left: -50px; top: 432px; width: 1180px; height: 353px; opacity: 0;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 60%, transparent 100%), linear-gradient(90deg, transparent 0%, #000 7%, #000 93%, transparent 100%);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 60%, transparent 100%), linear-gradient(90deg, transparent 0%, #000 7%, #000 93%, transparent 100%);
  mask-composite: intersect; }
#hosts img { display: block; width: 100%; height: 100%; object-fit: cover; }
.invita { position: absolute; left: 0; right: 0; top: 790px; text-align: center; font: italic 600 68px/1 'Cormorant', serif; color: var(--gold-soft); }
.fecha { position: absolute; left: 0; right: 0; top: 1364px; text-align: center; font-weight: 600; font-size: 34px; line-height: 1; color: #efe9dd; white-space: nowrap; }
.fecha b { color: var(--gold); font-weight: 800; }
#swoosh { position: absolute; left: 0; top: 0; overflow: visible; }
#swoosh path { fill: none; stroke-linecap: round; }

/* ---------- escena 3: pilares ---------- */
.hdr { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 26px;
  font-weight: 600; font-size: 31px; line-height: 1; color: var(--gold-soft); white-space: nowrap; }
.hdr .ln { display: block; width: 92px; height: 2px; background: linear-gradient(90deg, rgba(212,164,55,0), #d4a437); transform-origin: right center; }
.hdr .ln.r { background: linear-gradient(270deg, rgba(212,164,55,0), #d4a437); transform-origin: left center; }
.row { position: absolute; left: 0; width: 1080px; height: 205px; }
.row .ico { position: absolute; left: 138px; top: 27px; width: 150px; height: 150px; }
.row .ring { position: absolute; left: -2px; top: -2px; width: 154px; height: 154px; overflow: visible; transform: rotate(-90deg); }
.row .ring .disk { fill: url(#gDisk); opacity: 0; }
.row .ring .stroke { fill: none; stroke: url(#gRing); stroke-width: 2.6; stroke-dasharray: 1; stroke-dashoffset: 1; }
.row .glyph { position: absolute; left: 33px; top: 33px; width: 84px; height: 84px; overflow: visible; }
.row .txt { position: absolute; left: 330px; }
.row .l1, .row .l2 { font-weight: 800; font-size: 50px; line-height: 58px; white-space: nowrap; letter-spacing: .01em; }
.row .l1 { color: var(--ink); }
.row .dv { position: absolute; left: 118px; right: 56px; bottom: 0; height: 1.5px; transform-origin: left center;
  background: linear-gradient(90deg, rgba(212,164,55,0), rgba(212,164,55,.7) 16%, rgba(212,164,55,.5) 70%, rgba(212,164,55,0)); }

/* ---------- escena 4: patrocinadores ---------- */
#grid { position: absolute; left: 55px; top: 610px; width: 970px; height: 888px; perspective: 1700px; }
.card { position: absolute; width: 310px; height: 280px; border-radius: 26px; padding: 2px; opacity: 0;
  background: linear-gradient(140deg, #f8e199 0%, #9c6d1c 28%, #f0cd6a 52%, #6b4610 78%, #e8c068 100%);
  box-shadow: 0 18px 40px rgba(0,0,0,.65), 0 0 26px rgba(212,164,55,.16); backface-visibility: hidden; }
.card-in { width: 100%; height: 100%; border-radius: 24px; display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 0%, #1c160c 0%, #0b0906 55%, #050403 100%); }
.card img { display: block; max-width: 264px; max-height: 226px; object-fit: contain; }

/* ---------- escena 5a: fecha y sede ---------- */
#sede-foto { position: absolute; left: -40px; top: 262px; width: 1160px; height: 360px; opacity: 0;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 66%, transparent 100%), linear-gradient(90deg, transparent 0%, #000 8%, #000 92%, transparent 100%);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 66%, transparent 100%), linear-gradient(90deg, transparent 0%, #000 8%, #000 92%, transparent 100%);
  mask-composite: intersect; }
#sede-foto img { display: block; width: 100%; height: 100%; object-fit: cover; filter: brightness(.8) saturate(1.05); }
.mes { position: absolute; left: 0; right: 0; top: 1032px; text-align: center; font-weight: 700; font-size: 62px; line-height: 1; color: var(--ink); white-space: nowrap; }
.rule { position: absolute; left: 290px; width: 500px; height: 2px; transform-origin: center;
  background: linear-gradient(90deg, rgba(212,164,55,0), #d4a437 28%, #f7dd8a 50%, #d4a437 72%, rgba(212,164,55,0)); }
.info-line { position: absolute; left: 0; right: 0; top: 1158px; display: flex; align-items: center; justify-content: center; gap: 22px;
  font-weight: 600; font-size: 54px; line-height: 1; color: var(--ink); white-space: nowrap; }
.info-line svg { width: 68px; height: 68px; flex: none; overflow: visible; }
.sede { position: absolute; left: 0; right: 0; top: 1290px; text-align: center; }
.sede svg { display: block; width: 66px; height: 66px; margin: 0 auto 16px; overflow: visible; }
.sede-1 { font-weight: 800; font-size: 38px; line-height: 1.1; color: var(--ink); letter-spacing: .03em; white-space: nowrap; }
.sede-2 { font-weight: 600; font-size: 32px; line-height: 1; color: var(--gold); letter-spacing: .42em; padding-left: .42em; margin-top: 14px; white-space: nowrap; }

/* ---------- escena 5b: cierre ---------- */
#bigring { position: absolute; left: 0; top: 0; overflow: visible; }
#panel { position: absolute; left: 70px; top: 888px; width: 940px; height: 334px; border-radius: 28px; opacity: 0;
  border: 1.5px solid rgba(226,184,90,.5); background: linear-gradient(180deg, rgba(255,236,190,.06), rgba(255,236,190,.015));
  box-shadow: inset 0 0 44px rgba(212,164,55,.08), 0 20px 50px rgba(0,0,0,.45); }
.pr { position: absolute; left: 54px; right: 40px; display: flex; align-items: center; gap: 28px; }
.pr svg { width: 64px; height: 64px; flex: none; overflow: visible; }
.pr .t1 { font-weight: 700; font-size: 44px; line-height: 1.08; color: var(--ink); letter-spacing: .02em; white-space: nowrap; }
.pr .t2 { font-weight: 600; font-size: 28px; line-height: 1; color: var(--gold); letter-spacing: .38em; margin-top: 10px; white-space: nowrap; }
#cta { position: absolute; left: 140px; top: 1272px; width: 800px; height: 118px; border-radius: 59px; overflow: hidden; opacity: 0;
  background: linear-gradient(180deg, #fff2c6 0%, #f3cd6c 36%, #d39f37 62%, #f6d983 100%);
  box-shadow: inset 0 0 0 2px rgba(255,240,200,.45), 0 14px 34px rgba(0,0,0,.55), 0 0 var(--gr, 40px) rgba(242,192,92,var(--ga, .35));
  display: flex; align-items: center; justify-content: center; gap: 18px; }
#cta span { font-weight: 800; font-size: 41px; letter-spacing: .06em; color: #1c1408; white-space: nowrap; }
#cta svg { width: 44px; height: 44px; overflow: visible; }
#cta i { position: absolute; top: -20%; left: 0; width: 130px; height: 140%; transform: skewX(-20deg);
  background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85), rgba(255,255,255,0)); }
#web { position: absolute; left: 0; right: 0; top: 1436px; text-align: center; font-weight: 500; font-size: 42px; line-height: 1;
  letter-spacing: .14em; padding-left: .14em; color: #efe9dd; white-space: nowrap; }
#lema { position: absolute; left: 0; right: 0; top: 1526px; text-align: center; font-weight: 600; font-size: 30px; line-height: 1.6;
  letter-spacing: .32em; padding-left: .32em; color: #dcb052; white-space: nowrap; }

/* ---------- escena 6: QR de compra ---------- */
#q-kicker { position: absolute; left: 0; right: 0; top: 270px; text-align: center; font-weight: 700; font-size: 30px; letter-spacing: .3em; padding-left: .3em; color: var(--gold); white-space: nowrap; }
#q-brackets { position: absolute; left: 0; top: 0; overflow: visible; }
#q-card { position: absolute; left: 240px; top: 690px; width: 600px; height: 600px; border-radius: 34px; background: #fff; overflow: hidden;
  box-shadow: 0 0 0 4px #e2b54f, 0 0 0 10px rgba(226,181,79,.25), 0 0 80px rgba(240,190,90,.45), 0 30px 60px rgba(0,0,0,.6); }
#q-img { position: absolute; left: 12px; top: 12px; width: 576px; height: 576px; image-rendering: auto; }
#q-scan { position: absolute; left: 0; right: 0; top: 0; height: 120px; opacity: 0;
  background: linear-gradient(180deg, rgba(226,181,79,0) 0%, rgba(226,181,79,.35) 85%, rgba(226,181,79,.95) 100%); }
#q-sub { position: absolute; left: 0; right: 0; top: 1352px; text-align: center; font-weight: 500; font-size: 34px; color: #efe9dd; white-space: nowrap; }
#q-url { position: absolute; left: 0; right: 0; top: 1408px; text-align: center; font-weight: 800; font-size: 40px; letter-spacing: .01em; white-space: nowrap; }
#q-url .fit { display: inline-block; background: linear-gradient(180deg, #fff6d6 0%, #f5d47e 35%, #d9a842 60%, #f7df92 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
#q-info { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; font-weight: 600; font-size: 28px; letter-spacing: .08em; color: #d8cdb6; white-space: nowrap; }

/* ---------- efectos ---------- */
#sweep { position: absolute; top: -240px; left: 0; width: 460px; height: 2400px; opacity: 0; mix-blend-mode: screen;
  background: linear-gradient(90deg, rgba(255,200,110,0) 0%, rgba(255,200,110,.22) 30%, rgba(255,240,205,.95) 50%, rgba(255,200,110,.22) 70%, rgba(255,200,110,0) 100%); }
#flash { background: radial-gradient(circle at 50% 46%, rgba(255,251,240,1) 0%, rgba(255,238,200,.75) 35%, rgba(255,214,150,.22) 78%); opacity: 0; mix-blend-mode: screen; }
#vignette { background: radial-gradient(120% 82% at 50% 48%, rgba(0,0,0,0) 52%, rgba(0,0,0,.6) 100%); }
#grain { width: 1080px; height: 1920px; opacity: .1; mix-blend-mode: overlay; }

/* ---------- controles de vista previa ---------- */
#controls { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 18px;
  background: #0d0b08; border-top: 1px solid #2a2216; color: #e9dcc0; font: 500 14px/1 'Montserrat', sans-serif; }
#controls button { background: #d4a437; color: #140f07; border: 0; border-radius: 6px; width: 44px; height: 34px; font-size: 16px; cursor: pointer; }
#controls input { flex: 1; accent-color: #d4a437; }
#controls .t { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
body.render #controls { display: none; }
</style>
</head>
<body>
<svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7d1"/><stop offset=".22" stop-color="#f7d57c"/><stop offset=".45" stop-color="#d9a83c"/>
      <stop offset=".53" stop-color="#8c5b12"/><stop offset=".61" stop-color="#c58f2a"/><stop offset=".8" stop-color="#fbe08a"/><stop offset="1" stop-color="#a6741d"/>
    </linearGradient>
    <linearGradient id="gSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#ebebec"/><stop offset=".5" stop-color="#7b7d82"/>
      <stop offset=".58" stop-color="#cbccd0"/><stop offset=".85" stop-color="#ffffff"/><stop offset="1" stop-color="#9a9ca1"/>
    </linearGradient>
    <linearGradient id="gLam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b8"/><stop offset=".45" stop-color="#e2b44c"/><stop offset="1" stop-color="#9c6b18"/>
    </linearGradient>
    <linearGradient id="gFrame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5f17"/><stop offset=".5" stop-color="#ffe9a8"/><stop offset="1" stop-color="#8a5f17"/>
    </linearGradient>
    <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b8"/><stop offset=".5" stop-color="#d4a437"/><stop offset="1" stop-color="#7a5212"/>
    </linearGradient>
    <radialGradient id="gDisk" cx=".5" cy=".35" r=".7">
      <stop offset="0" stop-color="#2a2113"/><stop offset="1" stop-color="#0a0806"/>
    </radialGradient>
    <linearGradient id="gIcon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="72" y2="72">
      <stop offset="0" stop-color="#fff0b5"/><stop offset=".5" stop-color="#e4b54e"/><stop offset="1" stop-color="#b98522"/>
    </linearGradient>
    <linearGradient id="gSwoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c0610" stop-opacity="0"/><stop offset=".25" stop-color="#b30f26"/><stop offset=".62" stop-color="#d9303a"/>
      <stop offset=".86" stop-color="#e9ad44"/><stop offset="1" stop-color="#fff0b5"/>
    </linearGradient>
    <filter id="fBlur10" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
</svg>

<div id="viewport">
  <div id="stage">
    <div id="bg" class="layer"><div id="glow"></div><div id="rays"></div></div>
    <canvas id="arcs" class="layer" width="1080" height="1920"></canvas>

    <div id="cam" class="layer">
      <canvas id="globe" class="layer" width="1080" height="1920"></canvas>

      <section id="s1" class="scene">
        <div id="logo1" class="logo" style="top:1098px;font-size:104px"></div>
        <div class="sheen" id="sheen1"><i></i></div>
      </section>

      <section id="s2" class="scene">
        <div id="hosts"><img src="assets/anfitriones.jpg" alt="Anfitriones"></div>
        <svg id="swoosh" width="1080" height="1920" viewBox="0 0 1080 1920">
          <path id="swGlow" pathLength="1" stroke="url(#gSwoosh)" stroke-width="26" opacity=".38" filter="url(#fBlur10)" d="M-20 1442C260 1462 660 1442 880 1232S1010 942 1024 870"/>
          <path id="swCore" pathLength="1" stroke="url(#gSwoosh)" stroke-width="7" d="M-20 1442C260 1462 660 1442 880 1232S1010 942 1024 870"/>
          <polygon id="swHead" points="0,-17 30,0 0,17 7,0" fill="#ffe7a6"/>
        </svg>
        <div id="invita" class="invita"></div>
        <svg id="magno" class="metal" style="top:840px" width="1080" height="230" viewBox="0 0 1080 230"><text x="540" y="186" font-size="178" fill="url(#gGold)" filter="url(#fMagno)"></text></svg>
        <svg id="evento" class="metal" style="top:1022px" width="1080" height="210" viewBox="0 0 1080 210"><text x="540" y="158" font-size="156" fill="url(#gSilver)" filter="url(#fEvento)"></text></svg>
        <div id="box1" class="box" style="top:1218px"></div>
        <div id="fecha" class="fecha"></div>
        <div class="sheen" id="sheen2"><i></i></div>
      </section>

      <section id="s3" class="scene">
        <div id="h3" class="hdr" style="top:356px"><i class="ln"></i><span></span><i class="ln r"></i></div>
        <div id="rows"></div>
      </section>

      <section id="s4" class="scene">
        <div id="box4" class="box" style="top:466px"></div>
        <div id="grid"></div>
        <div class="sheen" id="sheen4"><i></i></div>
      </section>

      <section id="s5a" class="scene">
        <div id="sede-foto"><img src="assets/sede.jpg" alt="Sede del evento"></div>
        <svg id="dia" class="metal" style="top:640px" width="1080" height="420" viewBox="0 0 1080 420"><text x="540" y="356" font-size="372" fill="url(#gGold)" filter="url(#fDia)"></text></svg>
        <div id="mes" class="mes"></div>
        <i id="rule5" class="rule" style="top:1124px"></i>
        <div id="hora" class="info-line">
          <svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="28" fill="none" stroke="url(#gIcon)" stroke-width="3.6"/>
            <g id="hh"><line x1="36" y1="36" x2="36" y2="21" stroke="#f3d27a" stroke-width="4" stroke-linecap="round"/></g>
            <g id="mh"><line x1="36" y1="36" x2="36" y2="15" stroke="#fff0c2" stroke-width="3" stroke-linecap="round"/></g>
            <circle cx="36" cy="36" r="3.4" fill="#f3d27a"/></svg>
          <span id="horaTxt"></span>
        </div>
        <div id="sede" class="sede">
          <svg id="pin" viewBox="0 0 72 72"><ellipse id="pinShadow" cx="36" cy="68" rx="13" ry="3.5" fill="rgba(212,164,55,.45)"/>
            <g id="pinBody"><path d="M36 64s-19-18.6-19-33a19 19 0 0 1 38 0c0 14.4-19 33-19 33z" fill="none" stroke="url(#gIcon)" stroke-width="3.6" stroke-linejoin="round"/>
            <circle cx="36" cy="31" r="7" fill="url(#gIcon)"/></g></svg>
          <div class="sede-1" id="sede1"></div>
          <div class="sede-2" id="sede2"></div>
        </div>
      </section>
