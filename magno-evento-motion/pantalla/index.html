<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Magno Evento — Pantalla 640×1120</title>
<style>
@font-face { font-family: 'Archivo'; src: url(../assets/fonts/archivo-latin-standard-normal.woff2) format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: 'Montserrat'; src: url(../assets/fonts/montserrat-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 640px; height: 1120px; overflow: hidden; background: #000; }
body { font-family: 'Montserrat', sans-serif; color: #f4efe6; -webkit-font-smoothing: antialiased; }
#p { position: relative; width: 640px; height: 1120px; overflow: hidden;
  background: radial-gradient(120% 70% at 50% 40%, #1a130a 0%, #0a0805 50%, #020202 100%); }
.abs { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
#rays { position: absolute; left: 320px; top: 420px; width: 1600px; height: 1600px; margin: -800px 0 0 -800px; opacity: .5;
  background: repeating-conic-gradient(from 3deg, rgba(255,214,140,.12) 0deg 1.4deg, rgba(255,214,140,0) 1.4deg 7deg);
  -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.4) 18%, transparent 40%); }
#glow { position: absolute; left: 320px; top: 420px; width: 900px; height: 900px; margin: -450px 0 0 -450px;
  background: radial-gradient(circle, rgba(222,168,60,.30) 0%, rgba(222,168,60,.1) 30%, rgba(222,168,60,0) 65%); }
#foto { position: absolute; left: -20px; top: 112px; width: 680px; height: 230px; opacity: .85;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 28%, #000 62%, transparent 100%), linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  -webkit-mask-composite: source-in; }
#foto img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.75); }
.logo { top: 34px; font-weight: 600; font-size: 44px; letter-spacing: .04em; padding-left: .04em; line-height: 1; }
.logo .lam { display: inline-block; width: .76em; height: .7em; }
.logo .lam svg { display: block; width: 100%; height: 100%; }
.silver { background: linear-gradient(180deg, #fff 0%, #ece8e0 46%, #b4afa5 56%, #f7f4ee 100%); -webkit-background-clip: text; color: transparent; }
.sub { top: 86px; font-size: 15px; letter-spacing: .5em; padding-left: .5em; color: #e9e3d8; }
.net { top: 108px; font-size: 12px; font-weight: 600; letter-spacing: .5em; padding-left: .5em; color: #e2b54f; }
svg.metal { position: absolute; left: 0; width: 640px; overflow: visible; }
svg.metal text { font-family: 'Archivo'; font-weight: 900; font-stretch: 125%; text-anchor: middle; }
#box { position: absolute; left: 160px; top: 448px; width: 320px; height: 46px; border: 2px solid #e2b54f; border-radius: 8px;
  background: rgba(10,8,5,.85); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px;
  letter-spacing: .28em; padding-left: .28em; box-shadow: 0 0 18px rgba(240,190,90,.3); }
.gold { background: linear-gradient(180deg, #fff6d6 0%, #f5d47e 30%, #d9a842 56%, #f7df92 82%, #b8862b 100%); -webkit-background-clip: text; color: transparent; }
#fecha { top: 512px; font-weight: 800; font-size: 29px; letter-spacing: .04em; }
#sede { top: 552px; font-weight: 600; font-size: 17px; letter-spacing: .16em; padding-left: .16em; color: #d8cdb6; }
#comprar { top: 586px; font-family: 'Archivo'; font-weight: 900; font-size: 32px; letter-spacing: .06em; }
#qr { position: absolute; left: 165px; top: 646px; width: 310px; height: 310px; background: #fff; border-radius: 18px; overflow: hidden;
  box-shadow: 0 0 0 3px #e2b54f, 0 0 0 7px rgba(226,181,79,.25), 0 0 40px rgba(240,190,90,.45); }
#qr img { position: absolute; left: 5px; top: 5px; width: 300px; height: 300px; }
#url { top: 975px; font-weight: 700; font-size: 18px; color: #e9c46a; }
#tel { position: absolute; left: 70px; top: 1008px; width: 500px; height: 70px; border-radius: 35px;
  background: linear-gradient(180deg, #fff2c6 0%, #f3cd6c 36%, #d39f37 62%, #f6d983 100%); box-shadow: 0 0 26px rgba(242,192,92,.45);
  display: flex; align-items: center; justify-content: center; gap: 14px; color: #1c1408; }
#tel svg { width: 34px; height: 34px; }
#tel .l { font-weight: 700; font-size: 16px; letter-spacing: .14em; }
#tel .n { font-weight: 800; font-size: 36px; letter-spacing: .03em; }
#tel { overflow: hidden; }
#tel .sheen { position: absolute; top: 0; left: 0; width: 120px; height: 100%; transform: translateX(-200px) skewX(-20deg);
  background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.75), rgba(255,255,255,0)); pointer-events: none; }
#comprar { background-size: 100% 100%; }
.corner { position: absolute; width: 28px; height: 28px; border-color: rgba(226,181,79,.7); border-style: solid; border-width: 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7d1"/><stop offset=".22" stop-color="#f7d57c"/><stop offset=".45" stop-color="#d9a83c"/><stop offset=".53" stop-color="#8c5b12"/><stop offset=".61" stop-color="#c58f2a"/><stop offset=".8" stop-color="#fbe08a"/><stop offset="1" stop-color="#a6741d"/></linearGradient>
  <linearGradient id="gSilver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#ebebec"/><stop offset=".5" stop-color="#7b7d82"/><stop offset=".58" stop-color="#cbccd0"/><stop offset=".85" stop-color="#fff"/><stop offset="1" stop-color="#9a9ca1"/></linearGradient>
  <linearGradient id="gLam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".45" stop-color="#e2b44c"/><stop offset="1" stop-color="#9c6b18"/></linearGradient>
  <filter id="bev" x="-15%" y="-40%" width="130%" height="190%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
    <feSpecularLighting in="b" surfaceScale="5" specularConstant="1.2" specularExponent="26" lighting-color="#fff4d6" result="s"><fePointLight x="180" y="-160" z="200"/></feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
    <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
    <feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/><feFlood flood-color="#3a2404"/><feComposite in2="d" operator="in" result="edge"/>
    <feOffset in="edge" dy="3.5" result="ext"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="sh"/><feOffset in="sh" dy="10" result="sho"/><feFlood flood-color="#000" flood-opacity=".9"/><feComposite in2="sho" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="ext"/><feMergeNode in="edge"/><feMergeNode in="lit"/></feMerge>
  </filter>
</defs></svg>
<div id="p">
  <div id="glow"></div><div id="rays"></div>
  <div id="foto"><img src="../assets/sede.jpg" alt=""></div>
  <div class="abs logo"><span class="silver">BL</span><span class="lam"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="0,100 50,0 100,100 80,100 50,40 20,100" fill="url(#gLam)"/></svg></span><span class="silver" style="margin-left:.04em">CK RING</span></div>
  <div class="abs sub">BUSINESS</div>
  <div class="abs net">NETWORK</div>
  <svg class="metal" style="top:262px" width="640" height="110" viewBox="0 0 640 110"><text x="320" y="92" font-size="100" fill="url(#gGold)" filter="url(#bev)">MAGNO</text></svg>
  <svg class="metal" style="top:350px" width="640" height="100" viewBox="0 0 640 100"><text x="320" y="84" font-size="88" fill="url(#gSilver)" filter="url(#bev)">EVENTO</text></svg>
  <div id="box"><span class="gold">EMPRESARIAL</span></div>
  <div class="abs" id="fecha">13 DE NOVIEMBRE · 3–8 PM</div>
  <div class="abs" id="sede">HOTEL PRESIDENTE INTERCONTINENTAL · GDL</div>
  <div class="abs gold" id="comprar">COMPRA TU BOLETO</div>
  <div id="qr"><img src="../assets/qr-evento.png" alt="QR compra de boletos"></div>
  <i class="corner" style="left:146px;top:634px;border-left-width:3px;border-top-width:3px"></i>
  <i class="corner" style="left:466px;top:634px;border-right-width:3px;border-top-width:3px"></i>
  <i class="corner" style="left:146px;top:940px;border-left-width:3px;border-bottom-width:3px"></i>
  <i class="corner" style="left:466px;top:940px;border-right-width:3px;border-bottom-width:3px"></i>
  <div class="abs" id="url">blackringbusiness.com/evento-13-noviembre</div>
  <div id="tel"><i class="sheen"></i><svg viewBox="0 0 72 72"><path d="M22 10h10l5 15-7 5c3 7 8 12 15 15l5-7 15 5v10c0 4-3 7-7 7C34 60 12 38 12 17c0-4 3-7 7-7z" fill="none" stroke="#1c1408" stroke-width="5" stroke-linejoin="round"/></svg><span class="l">INFORMES</span><span class="n">33 2215 0456</span></div>
</div>
<script>
// Animación determinista para el MP4 (bucle de 10 s). El QR nunca se mueve.
const L = 10, TAU = Math.PI * 2;
const $ = q => document.querySelector(q);
const lights = [...document.querySelectorAll('fePointLight')];
window.seek = t => {
  const u = (t % L) / L;
  $('#rays').style.transform = `rotate(${u * 36}deg)`;
  $('#glow').style.opacity = .82 + .18 * Math.sin(u * TAU * 2);
  $('#foto img').style.transform = `scale(${1.04 + .04 * Math.sin(u * TAU)}) translateX(${6 * Math.sin(u * TAU)}px)`;
  lights.forEach(l => l.setAttribute('x', 320 + 300 * Math.sin(u * TAU)));
  const sw = (x, a, d) => Math.min(1, Math.max(0, (x - a) / d));
  $('#tel .sheen').style.transform = `translateX(${-200 + 900 * sw(u, .55, .14)}px) skewX(-20deg)`;
  $('#qr').style.boxShadow = `0 0 0 3px #e2b54f, 0 0 0 7px rgba(226,181,79,.25), 0 0 ${34 + 18 * (.5 + .5 * Math.sin(u * TAU * 2))}px rgba(240,190,90,.5)`;
  document.querySelectorAll('.corner').forEach((c, i) => c.style.opacity = .55 + .45 * (.5 + .5 * Math.sin(u * TAU * 2 - i * .8)));
};
seek(0);
</script>
</body>
</html>
